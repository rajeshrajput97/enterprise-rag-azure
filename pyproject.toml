[project]
name = "enterprise-rag-azure"
version = "0.1.0"
description = "RAG reference implementation with pluggable Azure OpenAI / OpenAI clients and a local offline stub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rajesh Kumar Rajput", email = "Rajesh.rajput97@gmail.com" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "numpy>=1.26",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
